[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discogs-auto-pricer"
version = "1.0.0"
description = "Aggiorna i prezzi di un CSV Marketplace Discogs con i suggerimenti ufficiali."
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
